name: Build BadgeForge (rootless .deb)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Theos build dependencies
        run: |
          brew install ldid xz
          command -v ldid

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build rootless package
        run: |
          make clean package FINALPACKAGE=1

      - name: Show package
        run: |
          ls -lah packages

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadgeForge-rootless
          path: packages/*.deb
          if-no-files-found: error
