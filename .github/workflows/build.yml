name: Build BadgeForge (rootless .deb)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Theos build dependencies
        run: |
          brew install ldid xz
          command -v ldid

      - name: Install Theos and patched iOS SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          export THEOS="$HOME/theos"
          "$THEOS/bin/install-sdk" latest
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework"

      - name: Validate source
        run: |
          python3 scripts/validate.py

      - name: Build rootless package
        run: |
          make clean package FINALPACKAGE=1

      - name: Show package
        run: |
          ls -lah packages

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadgeForge-rootless
          path: packages/*.deb
          if-no-files-found: error
